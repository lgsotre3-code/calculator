<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Mortgage PRO CALC">
  <defs>
    <linearGradient id="hmHouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16C7F7"/>
      <stop offset="1" stop-color="#006FE6"/>
    </linearGradient>
    <filter id="hmSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#062B66" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rising bars -->
  <rect x="6" y="58" width="10" height="26" rx="3" fill="#5EDAFB"/>
  <rect x="19" y="48" width="10" height="36" rx="3" fill="#16C7F7"/>

  <!-- growth arrow -->
  <path d="M8,80 C 28,78 44,66 62,50 C 70,43 76,38 82,33" fill="none" stroke="#19D65B" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="90,27 84,37.5 76.5,31" fill="#19D65B"/>

  <!-- house -->
  <g filter="url(#hmSoft)">
    <rect x="30" y="40" width="42" height="44" rx="6" fill="url(#hmHouse)"/>
    <polygon points="26,42 51,18 76,42" fill="#0A84E8" stroke="#0A84E8" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <circle cx="51" cy="54" r="7" fill="#FFFFFF"/>
  <line x1="45" y1="54" x2="57" y2="54" stroke="#0A84E8" stroke-width="2"/>
  <line x1="51" y1="48" x2="51" y2="60" stroke="#0A84E8" stroke-width="2"/>
  <path d="M44,84 v-11 a7,7 0 0 1 14,0 v11 z" fill="#EAF6FF"/>

  <!-- calculator -->
  <g filter="url(#hmSoft)">
    <rect x="60" y="56" width="30" height="34" rx="6" fill="#FFFFFF" stroke="#CFE4F6" stroke-width="1.5"/>
  </g>
  <rect x="64" y="60" width="22" height="9" rx="2.5" fill="#062B66"/>
  <circle cx="67" cy="74" r="2.2" fill="#C9E4F8"/>
  <circle cx="73" cy="74" r="2.2" fill="#C9E4F8"/>
  <circle cx="79" cy="74" r="2.2" fill="#C9E4F8"/>
  <circle cx="67" cy="81" r="2.2" fill="#DCEEFB"/>
  <circle cx="73" cy="81" r="2.2" fill="#DCEEFB"/>
  <rect x="75" y="78.5" width="11" height="5" rx="2.5" fill="#19D65B"/>
</svg>
