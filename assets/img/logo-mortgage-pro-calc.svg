<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 950" width="1240" height="950" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Mortgage PRO CALC — Smarter Mortgage Decisions</title>
  <desc id="logoDesc">Premium fintech logo: blue house with financial calculator, rising bar chart and green growth arrow. Palette: navy #062B66, royal #006FE6, cyan #16C7F7, green #19D65B, white.</desc>

  <defs>
    <linearGradient id="gHouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E5AD3"/>
      <stop offset="1" stop-color="#062B66"/>
    </linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A4FB8"/>
      <stop offset="1" stop-color="#05204E"/>
    </linearGradient>
    <linearGradient id="gBadgePRO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#006FE6"/>
      <stop offset="1" stop-color="#16C7F7"/>
    </linearGradient>
    <linearGradient id="gBadgeO" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16C7F7"/>
      <stop offset="1" stop-color="#006FE6"/>
    </linearGradient>
    <linearGradient id="gCalc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F2FD"/>
    </linearGradient>
    <radialGradient id="gGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#EAF6FF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="fSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#062B66" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1240" height="950" fill="#FFFFFF"/>
  <circle cx="620" cy="280" r="330" fill="url(#gGlow)"/>
  <ellipse cx="630" cy="474" rx="290" ry="17" fill="#062B66" opacity="0.08"/>

  <!-- ===== ICON ===== -->
  <!-- rising bar chart -->
  <g>
    <rect x="372" y="314" width="54" height="118" rx="14" fill="#ABECFD"/>
    <rect x="444" y="250" width="54" height="182" rx="14" fill="#5EDAFB"/>
    <rect x="516" y="186" width="54" height="246" rx="14" fill="#17C8F8"/>
    <rect x="588" y="122" width="54" height="310" rx="14" fill="#0AA9EE"/>
    <rect x="812" y="102" width="54" height="330" rx="14" fill="#067FE8"/>
  </g>

  <!-- green growth arrow -->
  <path d="M 372 408 C 520 396 610 350 700 282 C 770 228 830 192 876 163"
        fill="none" stroke="#19D65B" stroke-width="20" stroke-linecap="round"/>
  <polygon points="908,141 887,179 863,151" fill="#19D65B"/>

  <!-- house -->
  <g filter="url(#fSoft)">
    <rect x="742" y="152" width="34" height="62" rx="6" fill="#0A4FB8"/>
    <rect x="560" y="240" width="240" height="192" rx="16" fill="url(#gHouse)"/>
    <polygon points="535,252 680,108 825,252" fill="url(#gRoof)" stroke="url(#gRoof)" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <circle cx="680" cy="306" r="34" fill="#FFFFFF"/>
  <line x1="648" y1="306" x2="712" y2="306" stroke="#0E4FBF" stroke-width="5"/>
  <line x1="680" y1="274" x2="680" y2="338" stroke="#0E4FBF" stroke-width="5"/>
  <path d="M652,432 v-50 a28,28 0 0 1 56,0 v50 z" fill="#EAF4FF"/>
  <circle cx="698" cy="406" r="4" fill="#062B66" opacity="0.35"/>

  <!-- calculator (foreground) -->
  <g filter="url(#fSoft)">
    <rect x="758" y="298" width="164" height="168" rx="20" fill="url(#gCalc)" stroke="#CFE4F6" stroke-width="2"/>
  </g>
  <rect x="776" y="316" width="128" height="46" rx="10" fill="#062B66"/>
  <text x="790" y="351" font-family="'Segoe UI', Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF">$</text>
  <polygon points="871,338 884,326 897,338" fill="#FFFFFF"/>
  <rect x="877" y="338" width="14" height="12" rx="2" fill="#16C7F7"/>
  <!-- keypad: + - x = -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700">
    <circle cx="790" cy="382" r="9" fill="#D9EDFB"/><text x="790" y="387" text-anchor="middle" fill="#06538F">+</text>
    <circle cx="824" cy="382" r="9" fill="#D9EDFB"/><text x="824" y="387" text-anchor="middle" fill="#06538F">-</text>
    <circle cx="858" cy="382" r="9" fill="#D9EDFB"/><text x="858" y="387" text-anchor="middle" fill="#06538F">x</text>
    <circle cx="790" cy="408" r="9" fill="#EAF4FC"/>
    <circle cx="824" cy="408" r="9" fill="#EAF4FC"/>
    <circle cx="858" cy="408" r="9" fill="#EAF4FC"/>
    <circle cx="790" cy="434" r="9" fill="#EAF4FC"/>
    <circle cx="824" cy="434" r="9" fill="#EAF4FC"/>
    <rect x="842" y="426" width="44" height="16" rx="8" fill="#19D65B"/>
    <text x="864" y="439" text-anchor="middle" fill="#FFFFFF" font-size="15">=</text>
  </g>

  <!-- ===== WORDMARK ===== -->
  <!-- Mortgage, with the o replaced by a circular house badge -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" fill="#062B66" font-size="106">
    <text x="296" y="584" textLength="90" lengthAdjust="spacingAndGlyphs" letter-spacing="2">M</text>
    <text x="516" y="584" textLength="428" lengthAdjust="spacingAndGlyphs" letter-spacing="2">rtgage</text>
  </g>
  <circle cx="452" cy="546" r="50" fill="url(#gBadgeO)"/>
  <polygon points="432,557 452,537 472,557" fill="#FFFFFF"/>
  <rect x="446" y="557" width="12" height="13" rx="2.5" fill="#FFFFFF"/>

  <!-- PRO badge + CALC -->
  <rect x="426" y="636" width="170" height="86" rx="26" fill="url(#gBadgePRO)"/>
  <rect x="431" y="641" width="160" height="76" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.6"/>
  <text x="511" y="696" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="58" fill="#FFFFFF" letter-spacing="4" textLength="110" lengthAdjust="spacingAndGlyphs">PRO</text>
  <text x="618" y="704" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="68" fill="#062B66" letter-spacing="3" textLength="198" lengthAdjust="spacingAndGlyphs">CALC</text>

  <!-- ===== TAGLINE ===== -->
  <rect x="150" y="783" width="155" height="2" rx="1" fill="#B9CFE8"/>
  <rect x="935" y="783" width="155" height="2" rx="1" fill="#B9CFE8"/>
  <text x="620" y="792" text-anchor="middle" font-family="'Segoe UI', 'Century Gothic', Arial, sans-serif" font-weight="600" font-size="27" letter-spacing="6" fill="#123A73" opacity="0.92" textLength="560" lengthAdjust="spacing">SMARTER MORTGAGE DECISIONS</text>
</svg>
