<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #2b6cb0 100%);
      font-family: 'Segoe UI', 'Segoe UI Variable Display', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
    }
    /* Elementos decorativos */
    .circle { position: absolute; border-radius: 50%; opacity: 0.12; }
    .circle-1 { width: 420px; height: 420px; background: #4299e1; top: -110px; right: -110px; }
    .circle-2 { width: 320px; height: 320px; background: #38a169; bottom: -90px; left: -90px; }
    .circle-3 { width: 180px; height: 180px; background: #63b3ed; top: 50%; right: 240px; transform: translateY(-50%); }
    .content { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; color: #fff; }
    .badge {
      display: inline-block;
      background: rgba(66, 153, 225, 0.3);
      border: 1px solid rgba(66, 153, 225, 0.5);
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 14px;
      color: #90cdf4;
      margin-bottom: 20px;
      align-self: flex-start;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    h1 { font-size: 64px; font-weight: 800; line-height: 1.08; margin-bottom: 16px; max-width: 760px; }
    h1 span {
      background: linear-gradient(135deg, #48bb78, #38a169);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p { font-size: 22px; color: #a0c4e8; max-width: 660px; line-height: 1.5; margin-bottom: 30px; }
    .features { display: flex; gap: 30px; flex-wrap: wrap; }
    .features div { display: flex; align-items: center; gap: 10px; font-size: 16px; color: #bee3f8; }
    .features svg { width: 20px; height: 20px; fill: #48bb78; flex: none; }
    .right {
      position: absolute;
      right: 60px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.06);
      padding: 30px 35px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      min-width: 220px;
      backdrop-filter: blur(4px);
    }
    .right .amount { font-size: 48px; font-weight: 700; color: #48bb78; }
    .right .label { font-size: 14px; color: #a0c4e8; margin-top: 5px; }
    .right .sub {
      font-size: 13px;
      color: #a0c4e8;
      margin-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      padding-top: 15px;
      line-height: 1.5;
    }
    .right .sub b { color: #f6ad55; }
  </style>

<body>
  <div class="circle circle-1"></div>
  <div class="circle circle-2"></div>
  <div class="circle circle-3"></div>

  <div class="content">
    <div class="badge">&#128176; Free Financial Tool</div>
    <h1>Mortgage <span>Calculator</span></h1>
    <p>with Taxes, Insurance &amp; Extra Payments &mdash; Amortization Schedule &amp; Payment Breakdown</p>
    <div class="features">
      <div>
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>

      <div>
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Amortization Schedule
      </div>
      <div>
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        5 Languages
      </div>
    </div>
  </div>

  <div class="right">
    <div class="amount">$1,769</div>
    <div class="label">Monthly Payment</div>
    <div class="sub">&#128201; Save <b>$60,213</b> with<br>extra <b>$100</b>/month</div>
  </div>
</body>
</html>
