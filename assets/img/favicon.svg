<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mortgage calculator favicon: house + chart on a navy rounded square -->
  <rect width="64" height="64" rx="14" fill="#1a365d"/>
  <rect x="16" y="18" width="32" height="32" rx="4" fill="#4299e1"/>
  <rect x="16" y="18" width="32" height="8" rx="4" fill="#63b3ed"/>
  <!-- display window -->
  <rect x="20" y="30" width="24" height="16" rx="2" fill="#fff"/>
  <!-- bars -->
  <rect x="24" y="40" width="4" height="4" fill="#2b6cb0"/>
  <rect x="30" y="36" width="4" height="8" fill="#2b6cb0"/>
  <rect x="36" y="32" width="4" height="12" fill="#2b6cb0"/>
</svg>
