# .github/workflows/notify-search-engines.yml
# ----------------------------------------------
# Notifies Google (Search Console API) and Bing/Yandex (IndexNow) whenever
# sitemap.xml is updated on the main branch.

name: Notify Search Engines

on:
  push:
    branches: [main]
    paths: [sitemap.xml]
  workflow_dispatch:

jobs:
  notify:
    name: Submit sitemap to search engines
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify Google & IndexNow
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/notify-search-engines.mjs
